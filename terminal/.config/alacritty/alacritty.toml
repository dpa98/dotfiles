[general]
import = [
    "themes/gruvbox_material_hard_dark.toml"
]

[window]
#opacity = 0.9
title = ""
decorations = "none"
# dimensions desactivado para respetar gaps (window-gap 12px / top 44px en 1366x768)
# dimensions = { columns = 134, lines = 27 }
startup_mode = "Maximized"
dynamic_title = false
dynamic_padding = true

padding = { x = 3, y = 3 }

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
bold = { family = "JetBrainsMono Nerd Font", style = "SemiBold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 13
offset = { x = 0, y = 1 }
